<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realm</title>
    <style>
      /*
       * T3 Code applies its theme as CSS variables on <html> through the plugin bridge
       * (window.t3). The fallbacks keep the panel readable before the first context arrives.
       */
      :root {
        --bg: var(--color-background-primary, #ffffff);
        --surface: var(--color-background-secondary, #f6f6f7);
        --muted-bg: var(--color-background-tertiary, #eeeef0);
        --fg: var(--color-text-primary, #111113);
        --muted: var(--color-text-secondary, #5f5f68);
        --border: var(--color-border-primary, #e3e3e6);
        --input: var(--color-border-secondary, #d6d6da);
        --ring: var(--color-ring-primary, #6b6bff);
        --danger: var(--color-text-danger, #b42318);
        --success: var(--color-text-success, #15803d);
        --warning: var(--color-text-warning, #92400e);
        --radius: var(--border-radius-md, 8px);
        --font: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        --mono: var(--font-mono, ui-monospace, monospace);
        --danger-fill: var(--color-border-danger, #dc2626);
        --hover: color-mix(in oklab, var(--fg) 6%, transparent);
        color-scheme: light dark;
      }
      html[data-t3-theme="dark"] {
        --bg: var(--color-background-primary, #0f0f11);
        --surface: var(--color-background-secondary, #17171a);
        --muted-bg: var(--color-background-tertiary, #202024);
        --fg: var(--color-text-primary, #ededef);
        --muted: var(--color-text-secondary, #a1a1aa);
        --border: var(--color-border-primary, #26262b);
        --input: var(--color-border-secondary, #34343a);
        --danger: var(--color-text-danger, #f87171);
        --success: var(--color-text-success, #4ade80);
        --warning: var(--color-text-warning, #fbbf24);
        --hover: color-mix(in oklab, var(--fg) 8%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 var(--font);
      }
      svg {
        display: block;
        flex: none;
      }
      main,
      #content {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      main {
        padding: 12px 14px 24px;
      }
      p {
        margin: 0;
      }
      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      .spacer {
        flex: 1;
      }

      /* Buttons */
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex: none;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 1px);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--hover);
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button.primary {
        border-color: transparent;
        background: var(--fg);
        color: var(--bg);
      }
      button.primary:hover:not(:disabled) {
        background: color-mix(in oklab, var(--fg) 85%, var(--bg));
      }
      button.danger {
        border-color: transparent;
        background: var(--danger-fill);
        color: #fff;
      }
      button.danger:hover:not(:disabled) {
        background: color-mix(in oklab, var(--danger-fill) 88%, #000);
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      .icon-button {
        width: 28px;
        padding: 0;
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      .icon-button[aria-expanded="true"] {
        background: var(--hover);
        color: var(--fg);
      }

      /* Header */
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }
      .head h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 20px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        color: var(--success);
        background: color-mix(in oklab, var(--success) 14%, transparent);
      }
      .pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
      }
      .pill.warn {
        color: var(--warning);
        background: color-mix(in oklab, var(--warning) 14%, transparent);
      }
      .pill.bad {
        color: var(--danger);
        background: color-mix(in oklab, var(--danger) 14%, transparent);
      }
      .pill.off {
        color: var(--muted);
        background: var(--hover);
      }
      .tag {
        height: 20px;
        padding: 0 7px;
        border: 0;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        background: var(--hover);
      }
      .notice {
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .notice:empty {
        display: none;
      }
      .error {
        color: var(--danger);
      }

      /* Shown under the screen while the person has control, so the screen itself never moves. */
      .control-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 6px 6px 6px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 500;
        color: var(--warning);
        background: color-mix(in oklab, var(--warning) 12%, transparent);
      }
      .control-bar .text {
        flex: 1;
        min-width: 0;
      }
      .control-bar small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .control-bar button {
        border-color: color-mix(in oklab, var(--warning) 45%, transparent);
        background: transparent;
        color: var(--warning);
      }

      /* Screen */
      .screen {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        background: #0b0b0d;
      }
      .screen.controlled {
        border-color: transparent;
        box-shadow: 0 0 0 2px var(--warning);
      }
      .surface {
        position: relative;
        aspect-ratio: 16 / 10;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        touch-action: none;
      }
      .surface img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      .screen.controlled .surface {
        cursor: crosshair;
      }
      .surface-empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        background: var(--surface);
      }
      .surface-empty p {
        max-width: 34ch;
        overflow-wrap: anywhere;
      }
      .surface-empty strong {
        display: block;
        color: var(--fg);
        font-weight: 500;
      }
      .overlay {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }
      .overlay > * {
        pointer-events: auto;
      }
      .chip {
        min-width: 0;
        height: 24px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 11px;
        line-height: 24px;
        color: #e8e8ea;
        background: rgba(10, 10, 12, 0.66);
        backdrop-filter: blur(6px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .overlay .glass {
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(10, 10, 12, 0.66);
        color: #fff;
        backdrop-filter: blur(6px);
      }
      .overlay .glass:hover:not(:disabled) {
        background: rgba(10, 10, 12, 0.82);
      }
      .overlay .glass.icon {
        width: 28px;
        padding: 0;
      }

      /* Rows, in the style of the thread details card */
      .rows {
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        width: auto;
        height: 32px;
        margin: 0 -6px;
        padding: 0 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: color-mix(in oklab, var(--fg) 85%, transparent);
        font-size: 13px;
        font-weight: 500;
        text-align: left;
      }
      .row:hover:not(:disabled) {
        background: var(--hover);
      }
      .row > svg {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .row .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .meta {
        min-width: 0;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row.destructive,
      .row.destructive > svg {
        color: var(--danger);
      }
      .row[aria-expanded="true"] {
        background: var(--hover);
      }
      .switch {
        position: relative;
        flex: none;
        width: 30px;
        height: 18px;
        border-radius: 999px;
        background: var(--input);
        transition: background 120ms ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: var(--bg);
        transition: transform 120ms ease;
      }
      html[data-t3-theme="dark"] [aria-checked="false"] > .switch::after {
        background: var(--muted);
      }
      [aria-checked="true"] > .switch {
        background: var(--ring);
      }
      [aria-checked="true"] > .switch::after {
        transform: translateX(12px);
      }
      .sep {
        height: 1px;
        margin: 4px 0;
        background: var(--border);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .field input {
        flex: 1;
        min-width: 0;
      }
      .field button {
        height: 30px;
      }
      .chevron {
        width: 14px;
        height: 14px;
      }
      .caveat {
        font-size: 11px;
        color: var(--muted);
      }
      input[type="text"] {
        height: 30px;
        padding: 0 9px;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 1px);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
      }
      .typer {
        margin-bottom: 4px;
      }

      /* Menus */
      .menu-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        min-width: 180px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      }
      .menu.wide {
        left: -6px;
        right: -6px;
      }
      .menu.up {
        top: auto;
        bottom: calc(100% + 4px);
      }
      .menu button {
        justify-content: flex-start;
        height: 30px;
        padding: 0 8px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        font-weight: 400;
      }
      .menu button.option {
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        height: auto;
        padding: 6px 8px;
        white-space: normal;
        text-align: left;
      }
      .menu button.option strong {
        font-weight: 500;
      }
      .menu button.option small {
        font-size: 11px;
        color: var(--muted);
      }
      .menu button[aria-checked="true"] {
        background: var(--hover);
      }

      /* Boxes */
      .confirm,
      .problems,
      .box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 4px 0;
        padding: 12px;
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.45;
      }
      .confirm {
        border: 1px solid color-mix(in oklab, var(--danger) 35%, transparent);
        background: color-mix(in oklab, var(--danger) 7%, transparent);
      }
      .problems {
        gap: 8px;
        border: 1px solid color-mix(in oklab, var(--danger) 30%, transparent);
        background: color-mix(in oklab, var(--danger) 6%, transparent);
      }
      .box {
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }
      .box .actions,
      #setup .actions {
        justify-content: flex-start;
      }
      label {
        font-size: 12px;
        color: var(--muted);
      }

      /* Setup (rendered by script) */
      #setup-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      #setup {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 12px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .mono {
        font-family: var(--mono);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      dl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 4px 12px;
        margin: 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      ul.plain {
        margin: 0;
        padding-left: 16px;
      }
      code {
        font-family: var(--mono);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      /* Narrow panels: keep the screen controls on one line. */
      @media (max-width: 340px) {
        main {
          padding: 10px 10px 20px;
        }
        #frame-meta {
          display: none;
        }
        #take .label {
          display: none;
        }
        #take {
          width: 28px;
          padding: 0;
        }
        dl {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      /*
       * A maximized panel puts the screen beside the controls, and caps the screen to the panel's
       * height so nothing drops below the fold. --ar is the desktop's aspect ratio, set by script.
       */
      .stage,
      .side {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      @media (min-width: 800px) {
        /* The page is as wide as the screen that fits the panel's height, plus the controls. */
        main {
          max-width: calc((100vh - 150px) * var(--ar, 1.6) + 348px);
          margin: 0 auto;
        }
        #content {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 300px;
          align-items: start;
          gap: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="head" id="head">
        <h1>Realm</h1>
        <span class="pill" id="state-badge" hidden></span>
        <button type="button" class="tag" id="shared-chip" aria-expanded="false" hidden>Shared</button>
        <span class="spacer"></span>
        <div class="menu-wrap">
          <button type="button" class="icon-button" id="more-button" aria-label="More Realm actions" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
          <div class="menu" id="more-menu" role="menu" aria-label="More Realm actions" hidden>
            <button type="button" role="menuitem" id="menu-size">Desktop size…</button>
            <button type="button" role="menuitem" id="repair">Reset GUI driver</button>
            <button type="button" role="menuitem" id="refresh">Refresh</button>
          </div>
        </div>
      </header>

      <div class="notice" id="notice" role="status" aria-live="polite"></div>

      <div id="content" hidden>
        <div class="stage" id="stage">
          <div class="screen" id="screen">
            <div class="surface" id="surface">
              <img id="frame" alt="Latest capture of this thread's Realm" draggable="false" hidden />
              <div class="surface-empty" id="surface-empty">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                <p id="empty-text"></p>
                <button type="button" class="primary" id="screen-action" hidden></button>
              </div>
            </div>
            <div class="overlay" id="overlay" hidden>
              <span class="chip" id="frame-meta"></span>
              <span class="spacer"></span>
              <button type="button" class="glass icon" id="watch" aria-label="Pause watching" title="Pause watching"></button>
              <button type="button" class="glass" id="take" aria-label="Take control" title="Use the pointer and keyboard in the Realm. The agent waits until you hand back.">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
                <span class="label">Take control</span>
              </button>
            </div>
          </div>
          <div class="control-bar" id="control-banner" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
            <span class="text" role="status"><span id="control-text">You have control · agent paused</span><small>Shift+Esc releases the keyboard</small></span>
            <button type="button" id="handback">Hand back</button>
          </div>
        </div>

        <div class="side" id="side">

          <div class="problems" id="desktop-problems" role="status" hidden></div>

          <div class="box" id="size-box" hidden>
            <label for="size-input">Desktop size, as width × height</label>
            <div class="field">
              <input type="text" id="size-input" inputmode="numeric" autocomplete="off" placeholder="1600x900" />
              <button type="button" class="ghost" id="size-cancel">Cancel</button>
              <button type="button" class="primary" id="size-apply">Apply</button>
            </div>
          </div>

          <div class="rows">
            <div class="field typer" id="typer" hidden>
              <input type="text" id="type-text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Text to type into the Realm" placeholder="Type text into the Realm…" />
              <button type="button" id="type-send">Type</button>
            </div>
            <button type="button" class="row" id="agent-row" role="switch" aria-checked="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg>
              <span class="grow">Agent can use it</span>
              <span class="meta" id="agent-meta"></span>
              <span class="switch" aria-hidden="true"></span>
            </button>
            <div class="menu-wrap">
              <button type="button" class="row" id="kind-button" aria-haspopup="menu" aria-expanded="false" aria-controls="kind-menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                <span class="grow" id="kind-label">Desktop</span>
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="menu wide" id="kind-menu" role="menu" aria-label="Kind of Realm" hidden>
                <button type="button" class="option" role="menuitemradio" aria-checked="false" data-kind="realm">
                  <strong>Desktop</strong><small>Lightweight private desktop on this machine</small>
                </button>
                <button type="button" class="option" role="menuitemradio" aria-checked="false" data-kind="omarchy-vm">
                  <strong>Omarchy VM</strong><small>Own disk, kernel and Hyprland, in QEMU/KVM</small>
                </button>
              </div>
            </div>
            <div class="confirm" id="switch-confirm" hidden>
              <p id="switch-text"></p>
              <div class="actions">
                <button type="button" id="switch-cancel">Cancel</button>
                <button type="button" class="danger" id="switch-confirm-button">Switch</button>
              </div>
            </div>
            <div class="sep"></div>
            <button type="button" class="row" id="open-realms">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

    <script>

        var state = {

          status: null,
          loadError: null,
          busy: null,
          watching: true,
          frameAt: null,
          frameError: null,
          frameDesktop: null,
          confirmStop: false,
          sizeOpen: false,
          // The kind chosen before turning on; once on, the thread's preference decides.

        }

        function call(name, payload) {

        function parseSize(size) {

        }

        function realm() {
          return state.status && state.status.realm;
        }
        var KIND_NAMES = { realm: "Desktop", "omarchy-vm": "Omarchy VM" };
        function chosenKind() {

        }

        function isVm() {

        }

        /**

          var r = realm();
          var nodes = [];

          function problem(text, button) {

            if (button) nodes.push(el("div", { class: "actions" }, [button]));

            problem(
              "Couldn't read this Realm's state: " + status.runtimeFailure.error + " Stopping it retries cleanup; the workspace is kept.",

              "The GUI driver couldn't be prepared: " + (status.driverPreparation.error || status.driverPreparation.code || "unknown error") + ".",

        function applyStatus(next) {

          state.loadError = null;

          // Reopening the panel re-attaches to a setup job that is still running.

        function refresh() {

              function (result) {

              function (error) {

                if (failure.code === "busy") return;
                if (!state.status) state.loadError = failure.text;
                else setNotice(failure.text, true);
                render();
              },
            )
            .then(function () {
              state.statusInFlight = false;
              if (state.statusAgain) {
                state.statusAgain = false;
                refresh();
              } else scheduleStatus();
            });
        }

        var NEXT_STEP = {
          setup_required: "Finish setup below, then try again.",
          not_running: "Start the desktop first.",
          not_controlled: "Take control again to send input.",
          starting: "It is still starting; this panel checks again shortly.",
          timeout: "Try again.",
          cancelled: "Try again.",
        };

        function act(name, payload, pending) {

          state.busy = name;

          render();
          var threadId = state.threadId;
          return call(name, payload)
            .then(
              function (result) {

                if (result && result.data && result.data.threadId) applyStatus(result.data);
                setNotice((result && result.message) || "", false);
                return result;
              },
              function (error) {
                if (threadId !== state.threadId) return;
                var failure = parseError(error);
                var step = NEXT_STEP[failure.code];
                setNotice(failure.text + (step && failure.text.indexOf(step) < 0 ? " " + step : ""), true);

                refresh();

            .then(function (result) {

              render();
              scheduleStatus();

            });

        // ---- watching ------------------------------------------------------------------

        function wantFrames() {

            isLive() && visible() && (state.watching || isControlled()) && !state.frameError,

        function frameScale() {

            img.onerror = done;

          var wait = lastFrameRequest + interval - Date.now();

          lastFrameRequest = Date.now();

            .then(function (result) {

        function desktopSize() {

            .then(function () {
              input.inFlight = false;
              if (input.buffer.length) flushInput();

        function dropInput() {
          input.buffer = [];
          input.pressed = {};
          clearTimeout(timers.move);
          timers.move = null;
        }

        function pointer(event, immediate, extra) {

        var NAMED_KEYS = {

          Backspace: 0xff08,
          Tab: 0xff09,
          Escape: 0xff1b,
          Delete: 0xffff,
          Insert: 0xff63,
          Home: 0xff50,
          End: 0xff57,
          PageUp: 0xff55,
          PageDown: 0xff56,
          ArrowLeft: 0xff51,
          ArrowUp: 0xff52,
          ArrowRight: 0xff53,
          ArrowDown: 0xff54,
          CapsLock: 0xffe5,

        }

                enqueue({ type: "pointer", x: point.x, y: point.y, buttons: held | button }, true);

        // ---- setup ---------------------------------------------------------------------

        function jobActive(job) {

        }

          setup.error = null;
          renderSetup();
          var kind = chosenKind();
          return call("setup-review", { kind: kind })
            .then(

            )
            .then(function () {

              renderSetup();

        function startSetup() {
          setup.busy = true;
          setup.error = null;
          renderSetup();
          call("setup-start", { kind: reviewKind(setup.review), reviewId: setup.review.reviewId })
            .then(
              function (result) {
                if (result.data && result.data.jobId) {
                  setup.job = { job_id: result.data.jobId, state: "queued" };

                } else {
                  setNotice(result.message || "", false);
                  return reviewSetup().then(refresh);
                }
              },
              function (error) {
                var failure = parseError(error);
                setup.error = failure.text;
                if (failure.code === "changed") return reviewSetup();
              },
            )
            .then(function () {
              setup.busy = false;
              renderSetup();
            });
        }

        function pollJob() {
          clearTimeout(timers.job);
          timers.job = null;
          if (!jobActive(setup.job) || !visible()) return;
          timers.job = setTimeout(function () {
            timers.job = null;
            call("job-status", { jobId: setup.job.job_id }).then(
              function (result) {
                setup.job = result.data;
                renderSetup();
                if (jobActive(setup.job)) pollJob();
                else {
                  if (setup.job.state === "succeeded")
                    setNotice(
                      (reviewKind(setup.review) === "omarchy-vm" ? "The Omarchy VM is prepared." : "Setup complete.") +
                        " You can turn the Realm on.",
                      false,
                    );
                  reviewSetup().then(refresh);
                }
              },
              function (error) {
                var failure = parseError(error);
                if (failure.code !== "busy") setup.error = failure.text;
                renderSetup();
                pollJob();
              },
            );
          }, 1000);
        }

        function cancelJob() {
          setup.busy = true;
          renderSetup();
          call("job-cancel", { jobId: setup.job.job_id })
            .then(
              function (result) {
                if (result.data && result.data.state) setup.job = result.data;
              },
              function (error) {
                setup.error = parseError(error).text;
              },
            )
            .then(function () {
              setup.busy = false;
              renderSetup();
              pollJob();
            });
        }

        // A missing driver is what setup installs; everything else needs the system's package manager.
        var INSTALLED_BY_SETUP = ["verified cua-driver", "Omarchy base image"];
        /** What setup cannot do itself. Plans that list `blockers` say so; older ones only list `missing`. */
        function systemBlockers(review) {
          var names = Array.isArray(review.blockers) ? review.blockers : review.missing || [];
          return names.filter(function (name, index, all) {
            return all.indexOf(name) === index && INSTALLED_BY_SETUP.indexOf(name) < 0;
          });
        }
        function progressText(progress) {
          if (typeof progress === "string") return progress;
          return progress && typeof progress.message === "string" ? progress.message : null;
        }

        var BLOCKER_NAMES = { systemd_user: "systemd user session" };

        function setupFacts(review) {
          var driver = review.driver || {};
          var facts = [
            el("dt", { text: "Machine" }),
            el("dd", { text: [review.platform, review.arch].filter(Boolean).join(" · ") || "Unknown" }),
            el("dt", { text: "systemd user" }),
            el("dd", { text: review.systemdUser === true ? "Available" : review.systemdUser === false ? "Not available" : "Unknown" }),
            el("dt", { text: "GUI driver" }),
            el("dd", { text: "cua-driver " + driver.version + " (pinned) · " + (driver.installed ? "installed and verified" : "not installed") }),
          ];
          if (reviewKind(review) !== "omarchy-vm") {
            return facts.concat([
              el("dt", { text: "SHA-256" }),
              el("dd", { class: "mono", text: driver.archiveSha256 }),
              el("dt", { text: "Download" }),
              el("dd", { class: "mono", text: driver.url }),
              el("dt", { text: "Installs to" }),
              el("dd", { class: "mono", text: driver.destination }),
            ]);
          }
          var storage = review.storage || {};
          var base = review.base || {};
          facts.push(
            el("dt", { text: "Omarchy base" }),
            el("dd", { text: "Release " + review.release + " · " + (base.present ? "installed" : "not installed") }),
            el("dt", { text: "Each VM" }),
            el("dd", {
              text:
                Math.round((storage.memoryMiB || 0) / 102.4) / 10 + " GiB RAM · " +
                storage.cpus + (storage.cpus === 1 ? " CPU" : " CPUs") + " · " +
                storage.virtualDisk + " disk · " +
                (storage.network ? "network on" : "restricted network"),
            }),
            el("dt", { text: "Free space needed" }),
            el("dd", { text: gib(storage.requiredFreeBytes) || "Unknown" }),
          );
          (review.downloads || []).forEach(function (download) {
            facts.push(
              el("dt", { text: "Download" }),
              el("dd", {}, [
                el("span", { class: "mono", text: download.url }),
                el("br"),
                el("span", {
                  class: "hint",
                  text:
                    "About " + (gib(download.estimatedBytes) || "unknown size") +
                    (download.signer ? " · GPG-verified, signer " + download.signer : download.archiveSha256 ? " · SHA-256 " + download.archiveSha256 : "") +
                    " · to " + download.destination,
                }),
              ]),
            );
          });
          return facts;
        }

        function setupJobLine(job, vm) {
          var text = progressText(job.progress);
          var progress = text ? " (" + text + ")" : "";
          var what = vm ? "Omarchy VM preparation" : "Setup";
          if (job.state === "running" && job.progress && job.progress.stage === "packages")
            return "Installing system packages" + progress + "… Approve the password prompt on the machine running T3 Code. Cancelling waits for the package manager to finish.";
          return job.state === "queued"
            ? what + " queued…"
            : job.state === "running"
              ? (vm ? "Preparing the Omarchy VM" : "Setting up") + progress + "…"
              : job.state === "succeeded"
                ? vm ? "Omarchy VM prepared." : "Setup finished."
                : job.state === "cancelled"
                  ? what + " cancelled."
                  : what + " failed: " + (job.error || job.code || "unknown error") + ". Review and try again.";
        }

        function renderSetup() {
          var container = $("setup");
          var vm = isVm();
          var review = setup.review && reviewKind(setup.review) === chosenKind() ? setup.review : null;
          var job = setup.job;
          var active = jobActive(job);
          var ready = setupReady();
          // One line is enough: every entry says the same thing, and only stuck agents need one.
          var stuck = ((state.status && state.status.continuation) || []).filter(function (item) {
            return item.manualContinuationRequired;
          }).slice(-1)[0];
          $("setup-section").hidden = !(active || stuck || (state.status && !ready) || (review && !review.ready));
          var nodes = [];
          nodes.push(
            el("p", {
              class: "hint",
              text:
                (review && review.ready) || (ready && !active)
                  ? "Setup is complete on this machine."
                  : vm
                    ? "A signed Omarchy release is downloaded and installed into a base disk that every thread's VM builds on. It takes a while. Review it, then approve."
                    : "Review what it installs on the machine running T3 Code, then approve.",
            }),
          );
          if (review) {
            var blockers = systemBlockers(review);
            if (blockers.length) {
              nodes.push(
                el("div", { class: "box", role: "note" }, [
                  el("strong", { text: "Blocked: missing on this machine" }),
                  el(
                    "ul",
                    { class: "plain mono" },
                    blockers.map(function (name) {
                      return el("li", { text: BLOCKER_NAMES[name] || name });
                    }),
                  ),
                  el("span", {
                    class: "hint",
                    text: "Fix these on the machine running T3 Code, then review again. Realms never changes SSH keys, device permissions or your system's package keyring.",
                  }),
                ]),
              );
            }
            if (review.packages && review.packages.length && review.command) {
              nodes.push(
                el("div", { class: "box", role: "note" }, [
                  el("strong", { text: "Installs system packages" }),
                  el("span", { class: "mono", text: review.packages.join(" ") }),
                  el("span", { class: "hint", text: "Approving runs exactly this on the machine running T3 Code, which asks for your password there (Polkit):" }),
                  el("code", { class: "mono", text: review.command }),
                ]),
              );
            }
            nodes.push(el("dl", {}, setupFacts(review)));
            if (vm)
              nodes.push(
                el("p", {
                  class: "hint",
                  text: "The guest disk is unencrypted and its user has passwordless sudo. Files are copied in and out only when asked; nothing is shared or synced. Keep tokens and keys out of it.",
                }),
              );
          }
          if (job && (active || (review && !review.ready)))
            nodes.push(el("p", { class: job.state === "failed" ? "error" : "hint", text: setupJobLine(job, vm) }));
          if (stuck) nodes.push(el("p", { class: "hint", text: "Setup finished. " + stuck.message }));
          if (setup.error) nodes.push(el("p", { class: "error", text: setup.error }));
          var canApprove = review && !review.ready && !active && !setup.busy && systemBlockers(review).length === 0;
          nodes.push(
            el("div", { class: "actions" }, [
              review && !review.ready && !active
                ? el("button", {
                    type: "button",
                    class: "primary",
                    disabled: !canApprove,
                    text:
                      job && job.state === "failed"
                        ? "Retry setup"
                        : vm
                          ? "Approve and prepare Omarchy VM"
                          : review.packages && review.packages.length
                            ? "Approve and install"
                            : "Approve and install driver",
                    onclick: startSetup,
                  })
                : null,
              active
                ? el("button", { type: "button", disabled: setup.busy, text: "Cancel setup", onclick: cancelJob })
                : null,
              el("button", {
                type: "button",
                disabled: setup.busy,
                text: setup.busy && !active ? "Reviewing…" : review ? "Review again" : "Review setup",
                onclick: reviewSetup,
              }),
            ]),
          );
          container.replaceChildren.apply(container, nodes);
        }

        // ---- rendering -----------------------------------------------------------------

        var STATE_LABELS = {
          live: "Live",
          starting: "Starting",
          stopping: "Stopping",
          stopped: "Stopped",
          cleanup_failed: "Cleanup failed",
          "recovery-required": "Needs recovery",
          deleting: "Deleting",
        };
        var STATE_TONES = {
          live: "",
          starting: "warn",
          stopping: "warn",
          deleting: "warn",
          cleanup_failed: "bad",
          "recovery-required": "bad",
        };
        // Always visible: it is what decides whether to let an agent use this machine at all.
        var CAVEAT = {
          realm: "Private display, input and clipboard. Not a sandbox: it shares this machine's files and network.",
          "omarchy-vm":
            "Its own disk, kernel and desktop. Files are copied only when asked, and its network can reach services on this machine.",
        };
        var PAUSE_ICON =
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
        var PLAY_ICON =
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';

        function machineName() {
          return isVm() ? "VM" : "desktop";
        }

        // What the screen area says when there is no picture to show, and the one action that helps.
        function screenEmpty() {
          var status = state.status;
          var r = realm();
          var mode = status.mode;
          if (isLive()) {
            if (state.frameError) return { text: "Capture failed: " + state.frameError, action: "retry" };
            if (!visible()) return { text: "Paused while this panel is hidden." };
            if (!state.watching && !isControlled()) return { text: "Watching is paused.", action: "watch" };
            return { text: "Loading the first capture…" };
          }
          if (status.starting || (r && r.state === "starting") || pending(status.startAttempt)) {
            var attempt = status.starting || status.startAttempt || {};
            var progress = typeof attempt.progress === "string" ? attempt.progress : null;
            return {
              title: "Starting…",
              text: progress || (isVm() ? "A VM boot can take a minute or more." : null),
            };
          }
          if (r && (r.state === "stopping" || r.state === "deleting")) return { title: STATE_LABELS[r.state] + "…" };
          if (r && r.state === "recovery-required")
            return {
              title: "Needs recovery",
              text: "Its files changed after it stopped, so it can't be resumed." + (r.recoveryReason ? " " + r.recoveryReason : ""),
              action: "realms",
            };
          if (r && r.state === "cleanup_failed") return { title: "Cleanup didn't finish", action: "stop" };
          if (!setupReady()) return { title: "Setup needed", text: "A one-time setup on the machine running T3 Code.", action: "setup" };
          if (r && r.state === "stopped")
            return {
              title: "Stopped",
              text: "Its files are kept." + (r.lastActivity ? " Last active " + lastActive(r.lastActivity) + "." : ""),
              action: mode === "realm" ? "start" : "on",
            };
          return {
            title: "Not started",
            text: mode === "realm" ? "The agent starts it when it needs a desktop." : null,
            action: mode === "realm" ? "start" : "on",
          };
        }
        var SCREEN_ACTIONS = { retry: "Retry", watch: "Watch", realms: "All Realms", stop: "Stop…", setup: "Review setup", start: "Start", on: "Turn on" };

        function renderWatch() {
          var controlled = isControlled();
          var live = isLive();
          var status = state.status;
          var r = realm();
          var busy = Boolean(state.busy);
          $("control-banner").hidden = !controlled;
          var connection = r && r.controlConnection;
          $("control-text").textContent =
            connection === "failed"
              ? "You still have control, but the connection to the desktop was lost. The agent stays paused until you hand back."
              : "You have control · agent paused";
          $("screen").classList.toggle("controlled", controlled);
          var surface = $("surface");
          surface.tabIndex = controlled ? 0 : -1;
          if (controlled) {
            surface.setAttribute("role", "application");
            surface.setAttribute(
              "aria-label",
              "Realm desktop. Pointer and keyboard go to the Realm. Shift+Escape releases the keyboard.",
            );
          } else {
            surface.removeAttribute("role");
            surface.removeAttribute("aria-label");
          }
          var desktop = desktopSize();
          var ratio = desktop ? desktop.w + " / " + desktop.h : "";
          if (surface.style.aspectRatio !== ratio) {
            surface.style.aspectRatio = ratio;
            document.documentElement.style.setProperty("--ar", desktop ? String(desktop.w / desktop.h) : "1.6");
          }

          var showing = live && !$("frame").hidden && !state.frameError;
          var empty = status ? screenEmpty() : { text: "" };
          $("surface-empty").hidden = showing && (state.watching || controlled) && visible();
          // Frames re-render this many times a second; touch the DOM only when the message changes.
          var emptyKey = (empty.title || "") + "\n" + (empty.text || "");
          if ($("empty-text").dataset.key !== emptyKey) {
            $("empty-text").dataset.key = emptyKey;
            $("empty-text").replaceChildren.apply(
              $("empty-text"),
              [empty.title ? el("strong", { text: empty.title }) : null, empty.text || null].filter(Boolean),
            );
          }
          var action = $("screen-action");
          action.hidden = !empty.action;
          if (action.dataset.action !== (empty.action || "")) {
            action.dataset.action = empty.action || "";
            action.textContent = SCREEN_ACTIONS[empty.action] || "";
          }
          action.disabled = busy;

          $("overlay").hidden = !live || controlled;
          var meta = $("frame-meta");
          var metaText = !state.watching
            ? "Paused"
            : [
                r && r.size ? r.size.replace("x", "×") : null,
                r && typeof r.windowCount === "number" ? r.windowCount + (r.windowCount === 1 ? " window" : " windows") : null,
                r && r.kind === "omarchy-vm" && r.memoryMiB ? Math.round(r.memoryMiB / 102.4) / 10 + " GiB RAM" : null,
                r && r.kind === "omarchy-vm" && r.network === false ? "restricted network" : null,
              ]
                .filter(Boolean)
                .join(" · ");
          if (meta.textContent !== metaText) meta.textContent = metaText;
          var idle = r ? minutes(r.idleTtlSeconds) : null;
          var metaTitle = [
            state.frameAt ? "Captured " + state.frameAt + ". Captures repeat every second or two; they are not a video stream." : null,
            idle ? "Stops after " + idle + " without agent or viewer activity; its workspace is kept." : null,
          ]
            .filter(Boolean)
            .join(" ");
          if (meta.title !== metaTitle) meta.title = metaTitle;
          var watch = $("watch");
          if (watch.dataset.watching !== String(state.watching)) {
            watch.dataset.watching = String(state.watching);
            watch.innerHTML = state.watching ? PAUSE_ICON : PLAY_ICON;
            watch.setAttribute("aria-label", state.watching ? "Pause watching" : "Watch");
            watch.title = state.watching ? "Pause watching" : "Watch";
          }
          $("take").disabled = busy || !live;
          $("handback").disabled = busy;
          $("typer").hidden = !controlled;
        }

        function renderMenus() {
          var live = isLive();
          var busy = Boolean(state.busy);
          $("menu-size").disabled = busy || !live || isControlled();
          $("repair").disabled = busy || !live;
          $("more-button").setAttribute("aria-expanded", String(!$("more-menu").hidden));
          $("kind-button").setAttribute("aria-expanded", String(!$("kind-menu").hidden));
          var kind = chosenKind();
          Array.prototype.forEach.call(document.querySelectorAll("#kind-menu [data-kind]"), function (option) {
            option.setAttribute("aria-checked", String(option.dataset.kind === kind));
          });
        }

        // Action notices sit with the controls, so writing one never moves the screen.
        function placeNotice() {
          var notice = $("notice");
          if ($("content").hidden) {
            if (notice.previousElementSibling !== $("head")) $("head").after(notice);
          } else if ($("side").firstElementChild !== notice) $("side").prepend(notice);
        }

        function render() {
          var status = state.status;
          var content = $("content");
          var badge = $("state-badge");
          $("caveat").textContent = CAVEAT[chosenKind()];
          if (!state.threadId || !status) {
            $("control-banner").hidden = true;
            content.hidden = true;
            badge.hidden = true;
            $("shared-chip").hidden = true;
            if (!state.threadId) setNotice(bridge ? "Open a thread to see its Realm." : "Open this panel inside T3 Code.", false);
            else if (state.loadError) setNotice(state.loadError, true);
            else if (!$("notice").textContent) setNotice(LOADING_NOTICE, false);
            placeNotice();
            renderMenus();
            return;
          }
          content.hidden = false;
          placeNotice();
          var r = status.realm;
          var live = isLive();
          var starting = Boolean(status.starting || (r && r.state === "starting") || pending(status.startAttempt));
          var busy = state.busy;
          var kind = chosenKind();
          var ready = setupReady();
          var mode = status.mode;

          var badgeState = starting ? "starting" : r ? r.state : null;
          badge.hidden = !badgeState;
          badge.textContent = STATE_LABELS[badgeState] || badgeState || "";
          badge.className = "pill" + (badgeState === "stopped" ? " off" : STATE_TONES[badgeState] ? " " + STATE_TONES[badgeState] : "");
          $("shared-chip").hidden = !status.sharedFrom;
          $("shared-chip").title = SHARED_TEXT;

          var agent = $("agent-row");
          var agentOn = mode === "realm";
          agent.setAttribute("aria-checked", String(agentOn));
          agent.disabled = Boolean(busy) || (!agentOn && !ready);
          $("agent-meta").textContent =
            busy === "on"
              ? "Turning on…"
              : busy === "off"
                ? "Turning off…"
                : !agentOn && !ready
                  ? "Needs setup"
                  : mode === "off" && status.offBy === "agent"
                    ? "Agent turned it off"
                    : "";
          agent.title = !agentOn && !ready
            ? "Finish setup first."
            : agentOn
              ? "The agent may use this " + machineName() + ". Turning this off stops agent use only; the " + machineName() + " and its workspace stay."
              : mode === "off" && status.offBy === "user"
                ? "The agent can't use the Realm until you turn this on."
                : "Turning this on starts the " + machineName() + " for the agent.";

          var shownKind = state.confirmSwitch || kind;
          $("kind-label").textContent = KIND_NAMES[shownKind];
          $("kind-button").disabled = Boolean(busy) || isControlled();
          $("switch-confirm").hidden = !state.confirmSwitch;
          if (state.confirmSwitch)
            $("switch-text").textContent =
              "Switch this thread to " + KIND_NAMES[state.confirmSwitch] + "? The running " +
              KIND_NAMES[kind] + " stops and its apps close; its workspace is kept and you can switch back.";
          $("switch-confirm-button").disabled = Boolean(busy);

          var stoppable =
            live ||
            starting ||
            Boolean(status.runtimeFailure || status.driverCleanup) ||
            (r && (r.state === "cleanup_failed" || r.cleanupRequired));
          var stop = $("stop");
          stop.hidden = !stoppable;
          stop.disabled = Boolean(busy);
          $("stop-label").textContent = busy === "stop" ? "Stopping…" : isVm() ? "Stop VM…" : "Stop desktop…";
          if (!stoppable) state.confirmStop = false;
          $("stop-confirm").hidden = !state.confirmStop;
          $("stop-text").replaceChildren(
            el("strong", { text: isVm() ? "Stop this VM?" : "Stop this desktop?" }),
            " Its apps close and unsaved work in them is lost. The workspace is kept, and it can start again later.",
          );
          $("stop-confirm-button").textContent = isVm() ? "Stop VM" : "Stop desktop";
          $("stop-confirm-button").disabled = Boolean(busy);

          if (!live) state.sizeOpen = false;
          $("size-box").hidden = !state.sizeOpen;
          var sizeInput = $("size-input");
          if (document.activeElement !== sizeInput && r && r.size && !sizeInput.dataset.edited) sizeInput.value = r.size;
          $("size-apply").disabled = Boolean(busy) || !live;

          renderProblems();
          renderWatch();
          renderMenus();
          renderSetup();
        }

        // ---- wiring --------------------------------------------------------------------

        function turnOn(kind) {
          act(
            "on",
            { kind: kind },
            kind === "omarchy-vm"
              ? "Starting the Omarchy VM. A boot can take a minute or more."
              : "Starting the desktop. This can take up to 20 seconds.",
          );
        }

        // Menus close on outside clicks and Escape, and give focus back to their button.
        var MENUS = [
          { button: "more-button", menu: "more-menu" },
          { button: "kind-button", menu: "kind-menu" },
        ];
        function closeMenus(restoreFocus) {
          MENUS.forEach(function (entry) {
            var menu = $(entry.menu);
            if (menu.hidden) return;
            menu.hidden = true;
            if (restoreFocus) $(entry.button).focus();
          });
          renderMenus();
        }
        function toggleMenu(entry) {
          var menu = $(entry.menu);
          var opening = menu.hidden;
          closeMenus(false);
          menu.hidden = !opening;
          menu.classList.remove("up");
          renderMenus();
          if (opening) {
            // Open upward when the panel has no room below.
            if (menu.getBoundingClientRect().bottom > window.innerHeight && $(entry.button).getBoundingClientRect().top > menu.offsetHeight)
              menu.classList.add("up");
            var first = menu.querySelector('[aria-checked="true"]:not(:disabled)') || menu.querySelector("button:not(:disabled)");
            if (first) first.focus();
          }
        }
        MENUS.forEach(function (entry) {
          $(entry.button).addEventListener("click", function () {
            toggleMenu(entry);
          });
          $(entry.menu).addEventListener("keydown", function (event) {
            var items = Array.prototype.filter.call($(entry.menu).querySelectorAll("button"), function (item) {
              return !item.disabled;
            });
            var index = items.indexOf(document.activeElement);
            if (event.key === "ArrowDown" || event.key === "ArrowUp") {
              event.preventDefault();
              var step = event.key === "ArrowDown" ? 1 : -1;
              items[(index + step + items.length) % items.length].focus();
            } else if (event.key === "Home" || event.key === "End") {
              event.preventDefault();
              items[event.key === "Home" ? 0 : items.length - 1].focus();
            } else if (event.key === "Tab") closeMenus(false);
          });
        });
        document.addEventListener("pointerdown", function (event) {
          if (!event.target.closest || !event.target.closest(".menu-wrap")) closeMenus(false);
        });
        // A click elsewhere in T3 never reaches this frame, so leaving it closes menus too.
        window.addEventListener("blur", function () {
          closeMenus(false);
        });
        document.addEventListener("keydown", function (event) {
          // The controlled desktop consumes the Escape presses it forwards.
          if (event.key !== "Escape" || event.defaultPrevented) return;
          if (MENUS.some(function (entry) { return !$(entry.menu).hidden; })) {
            event.preventDefault();
            closeMenus(true);
          } else if (state.confirmStop) {
            event.preventDefault();
            $("stop-cancel").click();
          } else if (state.confirmSwitch) {
            event.preventDefault();
            $("switch-cancel").click();
          } else if (state.sizeOpen) {
            event.preventDefault();
            $("size-cancel").click();
          }
        });

        $("refresh").addEventListener("click", function () {
          closeMenus(false);
          setNotice("", false);
          state.frameError = null;
          refresh();
          if (setup.review) reviewSetup();
          pumpFrames();
        });
        $("repair").addEventListener("click", function () {
          closeMenus(false);
          act("repair", {}, "Resetting the GUI driver connection…");
        });
        $("menu-size").addEventListener("click", function () {
          closeMenus(false);
          state.sizeOpen = true;
          render();
          $("size-input").focus();
          $("size-input").select();
        });
        $("size-cancel").addEventListener("click", function () {
          state.sizeOpen = false;
          delete $("size-input").dataset.edited;
          render();
          $("more-button").focus();
        });
        $("shared-chip").addEventListener("click", function () {
          setNotice($("shared-chip").getAttribute("aria-expanded") === "true" ? "" : SHARED_TEXT, false);
        });
        $("open-realms").addEventListener("click", function () {
          call("open-realms").catch(function (error) {
            setNotice(parseError(error).text, true);
          });
        });
        $("agent-row").addEventListener("click", function () {
          if (state.status && state.status.mode === "realm") act("off", {}, "Turning off agent use…");
          else turnOn(chosenKind());
        });
        function chooseKind(next) {
          var status = state.status;
          if (!status || next === chosenKind()) return;
          var r = realm();
          if (status.mode === "realm" && r && (isLive() || isTransitional())) {
            state.confirmSwitch = next;
            render();
            $("switch-cancel").focus();
            return;
          }
          if (status.mode === "realm") {
            act("on", { kind: next }, "Switching to " + KIND_NAMES[next] + "…");
            return;
          }
          state.kindDraft = next;
          setup.review = null;
          setup.job = null;
          setup.error = null;
          render();
          reviewSetup();
        }
        Array.prototype.forEach.call(document.querySelectorAll("#kind-menu [data-kind]"), function (option) {
          option.addEventListener("click", function () {
            closeMenus(false);
            $("kind-button").focus();
            chooseKind(option.dataset.kind);
          });
        });
        $("switch-cancel").addEventListener("click", function () {
          state.confirmSwitch = null;
          render();
          $("kind-button").focus();
        });
        $("switch-confirm-button").addEventListener("click", function () {
          var next = state.confirmSwitch;
          state.confirmSwitch = null;
          dropInput();
          stopFrames();
          state.frameDesktop = null;
          $("frame").hidden = true;
          act("on", { kind: next }, "Switching to " + KIND_NAMES[next] + ". The current one stops; its workspace is kept.");
        });
        $("screen-action").addEventListener("click", function () {
          var action = $("screen-action").dataset.action;
          if (action === "retry" || action === "watch") {
            state.frameError = null;
            state.watching = true;
            renderWatch();
            pumpFrames();
          } else if (action === "realms") $("open-realms").click();
          else if (action === "stop") $("stop").click();
          else if (action === "setup") {
            if (!setup.review && !setup.busy) reviewSetup();
            $("setup-section").scrollIntoView({ block: "start" });
          } else if (action === "start" || action === "on") turnOn(chosenKind());
        });
        $("stop").addEventListener("click", function () {
          state.confirmStop = true;
          render();
          $("stop-cancel").focus();
        });
        $("stop-cancel").addEventListener("click", function () {
          state.confirmStop = false;
          render();
          $("stop").focus();
        });
        $("stop-confirm-button").addEventListener("click", function () {
          state.confirmStop = false;
          dropInput();
          act("stop", {}, isVm() ? "Stopping the VM…" : "Stopping the desktop…").then(function () {
            if (!$("stop").hidden) $("stop").focus();
          });
        });
        $("watch").addEventListener("click", function () {
          state.watching = !state.watching;
          if (!state.watching) stopFrames();
          renderWatch();
          pumpFrames();
        });
        $("take").addEventListener("click", function () {
          state.frameError = null;
          act("take", {}, "Taking control…").then(function () {
            if (isControlled()) {
              setNotice("You have control. Click the desktop to focus it.", false);
              $("surface").focus({ preventScroll: true });
            }
            pumpFrames();
          });
        });
        function handBack() {
          releaseKeys();
          flushInput();
          act("handback", {}, "Handing control back…").then(function () {
            if (!isControlled()) {
              dropInput();
              setNotice("Control handed back. The agent can use the Realm again.", false);
              $("take").focus();
            }
          });
        }
        $("handback").addEventListener("click", handBack);
        $("type-send").addEventListener("click", function () {
          var field = $("type-text");
          if (!field.value) return;
          typeText(field.value);
          field.value = "";
        });
        $("type-text").addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            $("type-send").click();
          }
        });
        $("size-input").addEventListener("input", function () {
          $("size-input").dataset.edited = "1";
        });
        $("size-input").addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            $("size-apply").click();
          }
        });
        $("size-apply").addEventListener("click", function () {
          var value = $("size-input").value.trim().toLowerCase().replace("×", "x");
          var size = parseSize(value);
          if (!size || size.w < 320 || size.h < 240 || size.w > 7680 || size.h > 4320) {
            setNotice("Enter the size as WIDTHxHEIGHT, for example 1600x900.", true);
            $("size-input").focus();
            return;
          }
          delete $("size-input").dataset.edited;
          state.frameDesktop = null;
          state.sizeOpen = false;
          act("size", { size: value }, "Resizing the desktop…");
          $("more-button").focus();
        });

        wireSurface();

        document.addEventListener("visibilitychange", function () {
          if (visible()) {
            refresh();
            pumpFrames();
            pollJob();
          } else {
            clearTimeout(timers.status);
            timers.status = null;
            stopFrames();
          }
          renderWatch();
        });
        window.addEventListener("focus", function () {
          if (visible()) refresh();
        });

        function applyContext(context) {
          var threadId = context && context.thread ? context.thread.threadId : null;
          if (threadId === state.threadId) return;
          // A different thread is a different Realm. Control on the old one stays held.
          stopFrames();
          dropInput();
          state.threadId = threadId;
          state.status = null;
          state.loadError = null;
          state.frameAt = null;
          state.frameError = null;
          state.frameDesktop = null;
          state.confirmStop = false;
          state.sizeOpen = false;
          state.kindDraft = null;
          state.confirmSwitch = null;
          state.watching = true;
          setup.review = null;
          setup.job = null;
          setup.error = null;
          $("frame").hidden = true;
          $("frame").removeAttribute("src");
          setNotice("", false);
          render();
          refresh();
        }

        render();
        if (bridge) {
          bridge.onContext(applyContext);
          bridge.ready.then(applyContext);
        }
      })();
    </script>
  </body>
</html>
